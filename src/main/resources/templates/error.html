<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: head('Error')}"></head>
<body class="bg-light">
    <nav th:replace="~{fragments/layout :: navbar}"></nav>

    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-8 col-lg-6">
                <div class="card shadow-sm border-0 border-top border-4 border-danger text-center p-4">
                    <div class="card-body">
                        <div class="mb-3">
                            <i class="bi bi-shield-x text-danger" style="font-size: 3.5rem;"></i>
                        </div>
                        <h4 class="fw-bold text-dark mb-2" th:text="${errorTitle != null ? errorTitle : 'Operation Rejected'}">Operation Rejected</h4>
                        <div class="alert alert-danger text-start my-3" role="alert">
                            <i class="bi bi-exclamation-triangle-fill me-2"></i>
                            <span th:text="${errorMessage}">An error occurred while processing your request.</span>
                        </div>
                        <p class="text-muted small">
                            This action was rejected in compliance with the Laboratory Equipment Booking System business rules and constraints.
                        </p>
                        <div class="d-flex justify-content-center gap-2 mt-4">
                            <a href="javascript:history.back()" class="btn btn-outline-secondary">
                                <i class="bi bi-arrow-left me-1"></i> Go Back
                            </a>
                            <a th:href="@{/}" class="btn btn-primary">
                                <i class="bi bi-house me-1"></i> Return to Home
                            </a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <footer th:replace="~{fragments/layout :: footer}"></footer>
    <script th:replace="~{fragments/layout :: scripts}"></script>
</body>
</html>
