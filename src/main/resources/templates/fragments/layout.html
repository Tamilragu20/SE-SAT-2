<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${title} + ' - Lab Equipment Booking System'">Lab Equipment Booking System</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        :root {
            --primary-color: #1e3a8a;
            --primary-hover: #1e40af;
            --secondary-color: #0d9488;
            --accent-color: #3b82f6;
            --bg-light: #f8fafc;
        }
        body {
            background-color: var(--bg-light);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        .navbar-brand {
            font-weight: 700;
            letter-spacing: 0.5px;
        }
        .card {
            border: none;
            border-radius: 10px;
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07), 0 2px 4px -2px rgba(0,0,0,0.05);
            transition: transform 0.15s ease-in-out, box-shadow 0.15s ease-in-out;
        }
        .card-header {
            border-top-left-radius: 10px !important;
            border-top-right-radius: 10px !important;
            font-weight: 600;
        }
        .btn-primary {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }
        .btn-primary:hover {
            background-color: var(--primary-hover);
            border-color: var(--primary-hover);
        }
        .btn-accent {
            background-color: var(--secondary-color);
            border-color: var(--secondary-color);
            color: #fff;
        }
        .btn-accent:hover {
            background-color: #0f766e;
            color: #fff;
        }
        .badge-confirmed { background-color: #2563eb; color: #fff; }
        .badge-checked-in { background-color: #f59e0b; color: #fff; }
        .badge-completed { background-color: #10b981; color: #fff; }
        .badge-cancelled { background-color: #ef4444; color: #fff; }
        .stat-card {
            border-left: 4px solid var(--primary-color);
        }
        .footer {
            margin-top: auto;
            background: #ffffff;
            border-top: 1px solid #e2e8f0;
            padding: 1rem 0;
            font-size: 0.875rem;
            color: #64748b;
        }
        .price-tag {
            font-size: 1.25rem;
            font-weight: 700;
            color: #0f172a;
        }
        .table > :not(caption) > * > * {
            padding: 0.75rem 1rem;
            vertical-align: middle;
        }
    </style>
</head>
<body>
    <nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top shadow-sm">
        <div class="container">
            <a class="navbar-brand d-flex align-items-center gap-2" th:href="@{/}">
                <i class="bi bi-cpu-fill text-info fs-4"></i>
                <span>Lab Equipment Booking System</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto mb-2 mb-lg-0" th:if="${currentUser != null}">
                    <!-- User Links -->
                    <li class="nav-item" th:if="${currentUser.role.name() == 'USER'}">
                        <a class="nav-link" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i> Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.role.name() == 'USER'}">
                        <a class="nav-link" th:href="@{/equipment}"><i class="bi bi-search me-1"></i> Search Availability</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.role.name() == 'USER'}">
                        <a class="nav-link" th:href="@{/my-bookings}"><i class="bi bi-calendar-check me-1"></i> My Bookings</a>
                    </li>

                    <!-- Admin Links -->
                    <li class="nav-item" th:if="${currentUser.role.name() == 'ADMINISTRATOR'}">
                        <a class="nav-link" th:href="@{/admin/dashboard}"><i class="bi bi-graph-up me-1"></i> Admin Dashboard</a>
                    </li>
                    <li class="nav-item" th:if="${currentUser.role.name() == 'ADMINISTRATOR'}">
                        <a class="nav-link" th:href="@{/admin/bookings}"><i class="bi bi-card-checklist me-1"></i> View Transactions</a>
                    </li>
                </ul>

                <div class="d-flex align-items-center gap-3" th:if="${currentUser != null}">
                    <span class="badge rounded-pill bg-light text-dark px-3 py-2 border">
                        <i class="bi bi-person-circle text-primary me-1"></i>
                        <strong th:text="${currentUser.name}">User</strong>
                        <span class="badge bg-secondary ms-1" th:text="${currentUser.role}">USER</span>
                    </span>
                    <a th:href="@{/logout}" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right me-1"></i> Logout</a>
                </div>

                <div class="d-flex align-items-center gap-2" th:if="${currentUser == null}">
                    <a th:href="@{/login}" class="btn btn-primary btn-sm"><i class="bi bi-box-arrow-in-right me-1"></i> Sign In</a>
                </div>
            </div>
        </div>
    </nav>

    <footer th:fragment="footer" class="footer text-center">
        <div class="container">
            <span>Laboratory Equipment Booking System &bull; Software Engineering SAT-II Assessment</span>
        </div>
    </footer>

    <script th:fragment="scripts" src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
